[project]
name = "fruit-recognition-api"
version = "0.1.0"
description = "Backend (FastAPI) para identificação de frutas por visão computacional no caixa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "SQLAlchemy==2.1.5",
    "python-multipart==0.0.32",
    "opencv-python==5.0.0.93",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
